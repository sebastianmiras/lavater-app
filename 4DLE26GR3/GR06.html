<script>const DATA=[{"id": "11", "descripcion": "Cenicienta está en su habitación.\n", "fase": "Situación inicial"}, {"id": "12", "fase": "Situación inicial", "descripcion": "La madre representa la maldad y se lo transmite a las hermanas."}, {"descripcion": "Invitan a la madre y a las hermanas al baile.\n", "id": "2", "fase": "Situación inicial"}, {"descripcion": "Cenicienta se encuentra triste porque a ella no le han invitado al baile. \n", "fase": "Situación inicial", "id": "3"}, {"id": "5", "descripcion": "Cenicienta pide un deseo a la hada madrina, la convierte en princesa y le da el carruaje. \n", "fase": "Conflicto"}, {"fase": "Conflicto", "descripcion": "Cenicienta está subida en la carroza de camino al baile y aparece el príncipe simbolizando que se van a encontrar.\n", "id": "20"}, {"descripcion": "Cenicienta llega al baile  y el príncipe ya está en el baile con las dos hermanastras. \n", "id": "7", "fase": "Conflicto"}, {"descripcion": "El príncipe y la Cenicienta se conocen.\n", "fase": "Conflicto", "id": "9"}, {"id": "6", "descripcion": "Dan las 00:00 y la Cenicienta se tiene que ir. \n", "fase": "Conflicto"}, {"id": "8", "fase": "Conflicto", "descripcion": "Cenicienta pierde un tacón y se sube al carruaje, el príncipe ve con Cenicienta se sube.\n"}, {"fase": "Desarrollo", "id": "10", "descripcion": "El príncipe vuelve al baile y se encuentra el tacón en las escaleras."}, {"fase": "Desarrollo", "descripcion": "Cenicienta se encuentra en su casa muy triste con sólo un tacón ya que había perdido el otro.\n", "id": "1"}, {"fase": "Desarrollo", "descripcion": "El príncipe y las Guardias reales van en busca de la casa de la Cenicienta. ", "id": "13"}, {"fase": "Desarrollo", "id": "4", "descripcion": "Las dos hermanastras salen a recibir al príncipe y las Guardias reales. Mientras la madre le dice a Cenicienta que no salga de casa \n"}, {"id": "18", "descripcion": "El príncipe ve a Cenicienta en su casa y quiere probarle el tacón a las tres hermanas \n", "fase": "Desarrollo"}, {"descripcion": "El príncipe le prueba el tacón a la primera hermanastra y no le cabe.", "fase": "Resolución", "id": "14"}, {"fase": "Resolución", "descripcion": "El príncipe  le prueba el tacón a la segunda hermanastra y tampoco le cabe.", "id": "15"}, {"id": "16", "descripcion": "El príncipe le prueba a Cenicienta el tacón y si le cabe. \n", "fase": "Resolución"}, {"fase": "Situación final", "id": "17", "descripcion": "Cenicienta ya tiene los dos tacones y se va con el príncipe, mientras las dos hermanas se quedan tristes en casa.\n"}, {"fase": "Situación final", "id": "19", "descripcion": "Cenicienta se va con el príncipe.\n"}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
