<script>const DATA=[{"descripcion": "Cenicienta vivía en una casa grande y lujosa con su madrastra y sus hermanastras.", "id": "3", "fase": "Situación inicial"}, {"descripcion": "La habitación de Cenicienta estaba en el desván, sin lujos y trabajaba para la madrastra de ama de casa.\n", "id": "1", "fase": "Situación inicial"}, {"id": "4", "fase": "Conflicto", "descripcion": "Las hermanastras se ponen sus vestidos más bonitos para asistir al baile donde el príncipe va a buscar a su futura esposa. La madrastra le advierte a Cenicienta que debe quedarse en casa y no salir.\n"}, {"fase": "Desarrollo", "id": "5", "descripcion": "Cenicienta estaba en el jardín y aparece el hada madrina y con su varita hace un hechizo, donde le da un vestido precioso y unos tacones para asistir al baile, pero el hechizo dura hasta las 00:00.\n"}, {"id": "7", "descripcion": "Cenicienta llega al baile y ve en el salón de baile al príncipe y sus hermanas alrededor cortejando. ", "fase": "Desarrollo"}, {"descripcion": "Cuando las hermanastras se van a un lado de la pista de baile Cenicienta se acerca al príncipe y comienzan a hablar.\n", "id": "9", "fase": "Desarrollo"}, {"fase": "Desarrollo", "descripcion": "El príncipe le concede un baile.\n", "id": "8"}, {"fase": "Desarrollo", "descripcion": "Salen al jardín para estar solos debajo de la luna.\n", "id": "20"}, {"id": "19", "fase": "Desarrollo", "descripcion": "En el jardín se acercan y se besan.\n"}, {"id": "6", "descripcion": "Suena la campanada de que son las 00:00 y Cenicienta sale corriendo por las escaleras porque se va acabar el hechizo.\n", "fase": "Desarrollo"}, {"id": "10", "fase": "Desarrollo", "descripcion": "Bajando las escaleras pierde un zapato pero no le da tiempo a volver a por él porque tiene que llegar a casa antes que su madrastra y hermanastras.\n"}, {"id": "11", "fase": "Desarrollo", "descripcion": "Llega a casa con un zapato.\n"}, {"descripcion": "Llega la madrastra enfadada con sus hijas porque el príncipe se ha fijado en otras chicas y no en ellas.", "fase": "Desarrollo", "id": "12"}, {"descripcion": "El príncipe encuentra el zapato en su palacio y sabe que es de la misteriosa chica que acudió a su baile, así que decide ir por todo el pueblo probando los zapatos a todas las doncellas. Llega a la casa de Cenicienta.", "fase": "Resolución", "id": "13"}, {"descripcion": "Se presenta el príncipe con sus guardias en la casa y se presenta ante la madrastra y sus hijas.\n", "id": "2", "fase": "Resolución"}, {"fase": "Resolución", "descripcion": "Prueba el zapato a la primera hermanastra y no le  cabe. Mientras Cenicienta estaba observando desde fuera.\n", "id": "15"}, {"id": "14", "fase": "Resolución", "descripcion": "Prueba el zapato a la segunda hermanastra y no le cabe. El príncipe pregunta si hay alguien más viviendo en esa casa y escucha un ruido del jardín.\n"}, {"fase": "Resolución", "descripcion": "Aparece Cenicienta y se prueba el zapato, le cabe a la perfección y el príncipe está feliz de haberla encontrado.\n", "id": "16"}, {"id": "17", "fase": "Situación final", "descripcion": "El príncipe le dice que se vaya con ella al palacio y sea su esposa y la madrastra se enfada y le dice que no puede irse.\n"}, {"descripcion": "Cenicienta acepta y se va con el príncipe y las hermanastras y la madrastra se quedan desde la puerta de casa viendo como se van enfadadas. \n", "id": "18", "fase": "Situación final"}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
