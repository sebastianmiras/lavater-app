<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4DLE26 — Métricas</title><style>:root{--bg:#0b0f14;--panel:#111821;--text:#e6edf3;--muted:#9aa4af;--max:1100px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}header{background:var(--panel)}.bar,main{max-width:var(--max);margin:auto;padding:1rem}.bar{display:flex;align-items:center;gap:.6rem}h1{font-size:clamp(18px,3vw,26px)}.spacer{flex:1}.btn{color:var(--text);text-decoration:none;border:1px solid #ffffff22;border-radius:.6rem;padding:.45rem .7rem;background:#ffffff0f}table{width:100%;border-collapse:collapse;margin-top:1rem}th,td{padding:.6rem;border-bottom:1px solid #ffffff20;text-align:left}th{cursor:pointer}.num{text-align:right}.muted{color:var(--muted)}</style></head><body><header><div class="bar"><h1>Métricas de ordenación — 4DLE26</h1><div class="spacer"></div><a class="btn" href="./index.html">← Volver</a><button class="btn" id="csv">⬇ CSV</button></div></header><main><p class="muted">Base: secuencia original 1→20.</p><table><thead><tr><th data-k="code">Grupo</th><th data-k="accuracy">Posición exacta %</th><th data-k="pairs">Pares en orden %</th><th data-k="lis">LIS %</th><th data-k="tol1">±1 %</th><th data-k="inv">Inversiones</th></tr></thead><tbody></tbody></table></main><script src="./groups-orders.js"></script><script>const LABELS={"GR01": "VERSOS Y TINTA", "GR02": "Lectoras Mágicas", "GR03": "Generación del 26", "GR04": "Érase una vez...", "GR05": "Entre líneas", "GR06": "Don Quijote de la Cancha", "GR07": "Las narradoras", "GR08": "LA TRIBU LECTORA", "GR09": "Sancho Panza"};function metrics(o){const n=20,P=190;let correct=0,inv=0,tol=0;for(let i=0;i<n;i++){if(o[i]===i+1)correct++;if(Math.abs((o[i]-1)-i)<=1)tol++;for(let j=i+1;j<n;j++)if(o[i]>o[j])inv++}const tails=[];for(const x of o){let lo=0,hi=tails.length;while(lo<hi){const m=(lo+hi)>>1;if(tails[m]<x)lo=m+1;else hi=m}tails[lo]=x}return{accuracy:+(100*correct/n).toFixed(1),pairs:+(100*(1-inv/P)).toFixed(1),lis:+(100*tails.length/n).toFixed(1),tol1:+(100*tol/n).toFixed(1),inv}}const rows=Object.entries(GROUP_ORDERS).map(([code,o])=>({code,label:LABELS[code],...metrics(o)}));const body=document.querySelector('tbody');function render(a){body.innerHTML=a.map(r=>`<tr><td><strong>${r.code}</strong> — ${r.label}</td><td class="num">${r.accuracy}</td><td class="num">${r.pairs}</td><td class="num">${r.lis}</td><td class="num">${r.tol1}</td><td class="num">${r.inv}</td></tr>`).join('')}render(rows);let key='code',dir=1;document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;dir=k===key?-dir:1;key=k;render([...rows].sort((a,b)=>(typeof a[k]==='number'?a[k]-b[k]:String(a[k]).localeCompare(String(b[k])))*dir))});document.getElementById('csv').onclick=()=>{const lines=[['Grupo','Nombre','Posición exacta %','Pares en orden %','LIS %','±1 %','Inversiones'].join(',')].concat(rows.map(r=>[r.code,'"'+r.label.replaceAll('"','""')+'"',r.accuracy,r.pairs,r.lis,r.tol1,r.inv].join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='4DLE26-metricas.csv';a.click()}</script></body></html>
