<script>const DATA=[{"id": "1", "descripcion": "Cenicienta está muy triste y encerrada en su habitación porque su madrastra y hermanastras le obligan a estar ahí.", "fase": "Situación inicial"}, {"descripcion": "Los soldados del palacio real llegan a la casa a invitar a las hermanastras de Cenicienta al baile que organiza el príncipe.", "id": "2", "fase": "Conflicto"}, {"fase": "Conflicto", "descripcion": "Las hermanastras y la madrastra llegan al baile, pero Cenicienta se queda en casa triste y sola", "id": "3"}, {"descripcion": "Aparece el hada madrina a ayudar a Cenicienta.\n\n", "fase": "Desarrollo", "id": "4"}, {"descripcion": "El Hada Madrina ayuda a Cenicienta a que pueda ir al baile. Le transforma una calabaza en un carruaje y le crea un vestido y unos zapatos de cristal.", "id": "5", "fase": "Desarrollo"}, {"descripcion": "Cenicienta llega al baile en su carroza.", "id": "6", "fase": "Desarrollo"}, {"fase": "Desarrollo", "id": "7", "descripcion": "Cenicienta llega al baile donde hay muchas personas, entre ellas sus hermanastras y el príncipe."}, {"fase": "Desarrollo", "id": "8", "descripcion": "Cenicienta conoce al príncipe."}, {"id": "9", "fase": "Desarrollo", "descripcion": "Cenicienta baila con el príncipe mientras todos los invitados les observan."}, {"id": "10", "descripcion": "Cenicienta tiene que irse del baile. Sale corriendo y con las prisas se le cae un zapato de cristal.", "fase": "Desarrollo"}, {"fase": "Desarrollo", "id": "11", "descripcion": "Cenicienta llega a su casa solo con un zapato y vuelve a encerrarse en su habitación."}, {"fase": "Desarrollo", "id": "12", "descripcion": "La madrastra y las hermanastras llegan a casa y hablan de la desconocida que ha bailado con el príncipe en la fiesta."}, {"id": "13", "descripcion": "El príncipe reúne a los soldados para ir en busca de la desconocida que perdió el zapato en la fiesta.", "fase": "Desarrollo"}, {"id": "14", "descripcion": "El príncipe y los soldados llegan a casa de Cenicienta, pero ella está escondida porque no le dejan salir de su habitación.", "fase": "Desarrollo"}, {"descripcion": "El príncipe le prueba los zapatos a las hermanastras, pero a ninguna le viene bien.", "fase": "Desarrollo", "id": "15"}, {"id": "16", "descripcion": "El príncipe encuentra a Cenicienta y le prueba el zapato y se da cuenta de que es ella la que buscaba.", "fase": "Resolución"}, {"descripcion": "Las hermanastras y la madrastra se enfadan mucho con Cenicienta. Ella y el príncipe están felices de haberse encontrado y de que Cenicienta pueda salir.\n\n", "fase": "Resolución", "id": "17"}, {"fase": "Resolución", "descripcion": "Cenicienta y el príncipe vuelven al castillo, mientras que la madrastra y las hermanastras se quedan en casa muy enfadadas.", "id": "18"}, {"id": "19", "fase": "Situación final", "descripcion": "Cenicienta y el príncipe están muy enamorados y se casan.\n"}, {"descripcion": "Organizan una gran celebración con todo el pueblo y son felices para siempre.", "fase": "Situación final", "id": "20"}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
