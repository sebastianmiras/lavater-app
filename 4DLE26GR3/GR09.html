<script>const DATA=[{"id": "3", "descripcion": "En esta primera foto se presenta la madrastra, la cual se representa como un círculo oscuro, y\nlas hermanastras de Cenicienta, representadas por dos círculos rosas con un óvalo en el centro.\nTambién aparece Cenicienta en un círculo gris, aparentando suciedad, ya que ella está limpiando la\ncasa.", "fase": "Situación inicial"}, {"id": "2", "descripcion": " Los guardias acuden a la casa para informar a la madrastra y a las hermanastras de que el rey\norganiza un baile.", "fase": "Situación inicial"}, {"id": "4", "fase": "Situación inicial", "descripcion": "Observamos como las hermanastras de cenicienta se van al baile junto con los guardias que\nhan ido a buscarlas. También apreciamos que la madrastra se queda en casa Cenicienta también, una\nvez más de color gris porque está haciendo las tareas del hogar."}, {"descripcion": "Se puede observar a la cenicienta sola y triste en su casa ya que no le han permitido ir al baile\ncon sus hermanastras.", "fase": "Conflicto", "id": "1"}, {"descripcion": "Aparece el hada madrina y utiliza su magia para ayudar a Cenicienta. Tras lanzarle un\nhechizo, Cenicienta recibe un vestido, zapatos de cristal y una carroza para poder acudir al baile. El\nhada le advierte que debe volver antes de medianoche porque el hechizo desaparecerá.", "fase": "Desarrollo", "id": "5"}, {"id": "7", "descripcion": "Se observa como el Rey y la Reina están sentados delante de una mesa morada observando el\nbaile, el príncipe está hablando con las hermanastras de Cenicienta. Cenicienta llega al baile con una\ncarroza.", "fase": "Desarrollo"}, {"descripcion": "El baile sigue igual, sin embargo, el Príncipe ya no habla con las hermanastras, sino con\nCenicienta, mientras las hermanastras están en una esquina apartadas.", "fase": "Desarrollo", "id": "9"}, {"fase": "Desarrollo", "descripcion": "El príncipe y la Cenicienta bailan y se enamoran.", "id": "8"}, {"id": "6", "descripcion": " Ha llegado la medianoche, por lo que Cenicienta está huyendo por las escaleras del palacio\npara que nadie vea que se le acaba el hechizo.", "fase": "Desarrollo"}, {"fase": "Desarrollo", "id": "10", "descripcion": "A Cenicienta se le ha acabado el hechizo y, mientras huía, se le ha perdido un tacón por las\nescaleras de palacio."}, {"fase": "Desarrollo", "id": "11", "descripcion": "Cenicienta llega a su casa triste puesto que únicamente tiene un zapato."}, {"id": "13", "descripcion": "Los guardias y el Príncipe llegan a casa de Cenicienta en busca de quién es el zapato perdido.\nSin embargo, se encuentra con la madrastra y las hermanastras.", "fase": "Desarrollo"}, {"id": "15", "descripcion": "Cenicienta está triste en su habitación con un solo zapato, mientras que el Príncipe y los\nguardias le prueban el zapato perdido a una de las hermanastras, a la cual el zapato no le encaja.", "fase": "Desarrollo"}, {"id": "14", "descripcion": " Ahora los guardias le prueban el zapato a la otra hermanastra pero tampoco le encaja.\nCenicienta sigue en su habitación únicamente con un zapato", "fase": "Desarrollo"}, {"descripcion": "Esta vez el Príncipe es quien le prueba el tacón a Cenicienta.", "fase": "Desarrollo", "id": "16"}, {"fase": "Resolución", "descripcion": "El zapato le queda perfecto a Cenicienta y su madrastra y hermanastras se empiezan a\nenfadar.", "id": "17"}, {"id": "12", "fase": "Resolución", "descripcion": "La madrastra y las hermanastras están muy enfadadas porque a cenicienta le quede el zapato\ny a ellas no."}, {"id": "18", "descripcion": "Cenicienta se va junto con los guardias y el Príncipe de la casa hacia su carroza. La\nmadrastra y las hermanastras siguen enfadadas.", "fase": "Situación final"}, {"id": "20", "descripcion": " Cenicienta se larga en la carroza junto al Príncipe.", "fase": "Situación final"}, {"descripcion": "En la imagen final, Cenicienta y el príncipe están juntos y felices.", "fase": "Situación final", "id": "19"}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
