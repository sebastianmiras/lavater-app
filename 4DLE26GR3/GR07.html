<script>const DATA=[{"fase": "Situación inicial", "descripcion": "Cenicienta está limpiando la casa que está llena de ceniza.\n", "id": "1"}, {"fase": "Situación inicial", "id": "2", "descripcion": "Los soldados aparecen en la casa y les hace entrega de la invitación del baile a la madrastra y a las hermanastras de Cenicienta."}, {"id": "3", "fase": "Conflicto", "descripcion": "Las madrastra empieza a vestir  las hermanastras para el baile mientras que a Cenicienta le rompe el vestido y sigue limpiando."}, {"descripcion": "La madrastra le prohíbe asistir al baile y se tiene que quedar muy triste en casa limpiando.", "fase": "Conflicto", "id": "4"}, {"id": "5", "fase": "Desarrollo", "descripcion": "Aparece el Hada madrina y le hace el hechizo para que no le reconozcan en el baile, además de darle un nuevo vestido y unos zapatos de cristal. Pero hay un problema, el hechizo se deshace a las 00:00"}, {"fase": "Desarrollo", "id": "6", "descripcion": "Cenicienta entra en palacio.\n"}, {"descripcion": "Cenicienta entra al baile y ve a las hermanastras, a la madrastra, al príncipe y a los reyes.", "fase": "Desarrollo", "id": "7"}, {"fase": "Desarrollo", "descripcion": "Cenicienta baila con el príncipe y se enamoran.", "id": "8"}, {"descripcion": "Siguen bailando y están rodeados toda la gente de palacio, todos se le quedan mirando. ", "id": "9", "fase": "Desarrollo"}, {"id": "10", "descripcion": "\n\nDe repente, dan las doce y Cenicienta sale corriendo por las escaleras dejándose atrás su razón de cristal debido a que está a punto de romperse el hechizo.\n", "fase": "Desarrollo"}, {"fase": "Desarrollo", "descripcion": "Cenicienta llega a casa y vuelve a la normalidad,  se encierra en su habitación y se da cuenta que se ha dejado un zapato en palacio. ", "id": "11"}, {"id": "12", "fase": "Desarrollo", "descripcion": "\n\nLa madrastra y las hermanastras llegan a casa, comentan el baile y les echa la bronca porque no han cumplido con lo prometido que era acercarse al príncipe y conquistarle.\n"}, {"descripcion": "\n\nEl príncipe y los soldados,  tras una larga búsqueda de la dama con la que bailó en la fiesta, llega a la casa de la madrastra y las hermanastras.\n", "id": "13", "fase": "Desarrollo"}, {"fase": "Desarrollo", "descripcion": "Le prueban el zapato a una de las hermanastras y no encaja.", "id": "14"}, {"descripcion": "Se lo prueban a la segunda hermanastra y tampoco.", "id": "15", "fase": "Desarrollo"}, {"descripcion": "Cenicienta aparece con el otro zapato y le prueban el que tiene el príncipe y encaja a la perfección.", "fase": "Resolución", "id": "16"}, {"fase": "Resolución", "descripcion": "\n\nSe dan cuenta que los zapatos coinciden con los pies de cenicienta y se va con el príncipe. Mientras tanto sus hermanastras y la madrastra están enfadadas.\n", "id": "17"}, {"fase": "Resolución", "id": "18", "descripcion": "La madrastra y las hijas se quedan en casa y Cenicienta se va con el príncipe y el hada madrina aparece contenta. "}, {"descripcion": "Cenicienta y el príncipe se casan. El hada madrina le ha hecho el traje de boda a Cenicienta. ", "fase": "Situación final", "id": "19"}, {"descripcion": "Cenicienta y el príncipe festejan su compromiso ante todos los ciudadanos del pueblo.", "id": "20", "fase": "Situación final"}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
