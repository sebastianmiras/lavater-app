<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4DLE26 — LAVATER</title><style>
:root{--bg:#0b0f14;--panel:#111821;--text:#e6edf3;--muted:#9aa4af;--max:1200px;--caption-size:clamp(18px,2.2vh + .6rem,28px)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:var(--panel);box-shadow:0 2px 8px #0006}.bar{max-width:var(--max);margin:auto;padding:.65rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}.title{font-weight:650}.spacer{flex:1}.btn{border:1px solid #ffffff20;background:#ffffff0f;color:var(--text);padding:.45rem .7rem;border-radius:.6rem;cursor:pointer;text-decoration:none;font-size:.95rem}.btn:hover{background:#ffffff1f}.btn:disabled{opacity:.45;cursor:not-allowed}.stage{display:grid;place-items:center}.frame{width:100%;max-width:var(--max);padding:.6rem 1rem}figure{margin:0}.image-wrap{position:relative;background:#000;display:grid;place-items:center;border-radius:.8rem;overflow:hidden}#slide{display:block;width:100%;height:auto;max-height:calc(100vh - 220px);object-fit:contain}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.nav{pointer-events:auto;border:0;background:#0008;color:#fff;padding:.7rem .9rem;margin:.4rem;border-radius:.7rem;font-size:1.1rem;cursor:pointer}figcaption{margin:.8rem 0 0;line-height:1.5}.caption{font-size:var(--caption-size)}.meta{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap;color:var(--muted);margin-top:.25rem}.chip,.kbd{background:#ffffff14;border-radius:.4rem;padding:.15rem .4rem}.hi-contrast #slide{filter:contrast(1.1) saturate(1.05)}
</style></head><body><header><div class="bar"><div class="title">4DLE26 — LAVATER · Secuencia original</div><div id="counter">1 / 20</div><div class="spacer"></div><a class="btn" href="./index.html">← Volver al índice</a><button class="btn" id="prev">◀</button><button class="btn" id="next">▶</button><button class="btn" id="fs">⤢ Pantalla completa</button><button class="btn" id="contrast">Alto contraste</button></div></header><main class="stage"><div class="frame"><div class="image-wrap"><img id="slide" alt="Secuencia original"><div class="overlay"><button class="nav" id="oprev">◀</button><button class="nav" id="onext">▶</button></div></div></div></main><script>let i=0;const img=document.getElementById('slide');function show(n){if(n<0||n>19)return;i=n;img.src='/lavater-app/images-secuencia/'+(i+1)+'.jpg';img.alt=`Viñeta ${i+1} de 20`;document.getElementById('counter').textContent=`${i+1} / 20`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===19}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fs(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fs;document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fs()});show(0);</script></body></html>
