<script>const DATA=[{"id": "1", "descripcion": "Cenicienta se encuentra triste en el sótano de la casa de su madrastra con sus dos hermanas, cubierta de cenizas.", "fase": "Situación inicial"}, {"fase": "Situación inicial", "descripcion": "Unos guardias llegan a la casa de Cenicienta con noticias de un baile donde el príncipe elegirá a su futura esposa. ", "id": "2"}, {"descripcion": "Las hermanas se preparan para un baile fantaseando con casarse con el príncipe.", "fase": "Conflicto", "id": "3"}, {"fase": "Conflicto", "id": "4", "descripcion": "Ya preparadas van al palacio escoltadas por los guardias y Cenicienta y la madrastra se quedan en casa. "}, {"fase": "Conflicto", "descripcion": "Cenicienta se va triste al bosque y aparece el hada madrina para cumplirle un deseo.", "id": "5"}, {"id": "6", "fase": "Desarrollo", "descripcion": "Cenicienta arreglada por la hada madrina llega al palacio. "}, {"id": "7", "fase": "Desarrollo", "descripcion": "Cenicienta entra al baile. "}, {"id": "8", "fase": "Desarrollo", "descripcion": "Cenicienta se encuentra cara a cara con el príncipe. "}, {"fase": "Desarrollo", "id": "10", "descripcion": "El príncipe y Cenicienta bailan frente a todos."}, {"id": "11", "descripcion": "El hechizo se rompe y Cenicienta huye del baile, dejando atrás un zapato en la escalera. ", "fase": "Desarrollo"}, {"fase": "Desarrollo", "id": "12", "descripcion": "Cenicienta vuelve a su casa con un único zapato."}, {"fase": "Resolución", "id": "13", "descripcion": "La madrastra se enfada con sus hijas, porque no las ha escogido para bailar."}, {"descripcion": "El príncipe coge el zapato, yendo a todas las casas para descubrir quién es la dueña del zapato.", "fase": "Resolución", "id": "15"}, {"fase": "Resolución", "descripcion": "Los guardias prueban el zapato a la hermana de Cenicienta.", "id": "14"}, {"descripcion": "Los guardias prueban el zapato a la otra hermana de Cenicienta.", "id": "16", "fase": "Resolución"}, {"id": "17", "descripcion": "Los guardias encontraron a Cenicienta a través de su canto, le prueban el zapato y es el suyo. ", "fase": "Resolución"}, {"descripcion": "Como el zapato le coge a Cenicienta, las hermanas y la madrastra se quedan sorprendidas y muy enfadadas. ", "fase": "Situación final", "id": "19"}, {"id": "18", "fase": "Situación final", "descripcion": "El príncipe va al palacio con Cenicienta y las hermanas se quedan enfadadas."}, {"descripcion": "El príncipe y Cenicienta se van juntos con el fin de casarse.", "fase": "Situación final", "id": "9"}, {"id": "20", "descripcion": "Cenicienta tira los zapatos del carruaje, ya que su sueño se ha hecho realidad. ", "fase": "Situación final"}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
