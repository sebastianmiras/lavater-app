*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:var(--panel);box-shadow:0 2px 8px #0006}.bar{max-width:var(--max);margin:auto;padding:.65rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}.title{font-weight:650}.spacer{flex:1}.btn{border:1px solid #ffffff20;background:#ffffff0f;color:var(--text);padding:.45rem .7rem;border-radius:.6rem;cursor:pointer;text-decoration:none;font-size:.95rem}.btn:hover{background:#ffffff1f}.btn:disabled{opacity:.45;cursor:not-allowed}.stage{display:grid;place-items:center}.frame{width:100%;max-width:var(--max);padding:.6rem 1rem}figure{margin:0}.image-wrap{position:relative;background:#000;display:grid;place-items:center;border-radius:.8rem;overflow:hidden}#slide{display:block;width:100%;height:auto;max-height:calc(100vh - 220px);object-fit:contain}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.nav{pointer-events:auto;border:0;background:#0008;color:#fff;padding:.7rem .9rem;margin:.4rem;border-radius:.7rem;font-size:1.1rem;cursor:pointer}figcaption{margin:.8rem 0 0;line-height:1.5}.caption{font-size:var(--caption-size)}.meta{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap;color:var(--muted);margin-top:.25rem}.chip,.kbd{background:#ffffff14;border-radius:.4rem;padding:.15rem .4rem}.hi-contrast #slide{filter:contrast(1.1) saturate(1.05)}

<script>const DATA=[{"id": "1", "fase": "Situación inicial", "descripcion": "Cenicienta permanece sola junto al hogar, dentro de una casa oscura, mientras una tenue claridad destaca su pequeña figura entre las sombras."}, {"id": "2", "fase": "Situación inicial", "descripcion": "La madrastra y sus dos hijas aparecen reunidas en la vivienda y tres soldados se acercan a esta."}, {"descripcion": "Cenicienta está apartada mientras la madrastra y las hermanastras se preparan para el baile.", "fase": "Conflicto", "id": "3"}, {"id": "4", "descripcion": "Las hermanas ya vestidas, salen de casa para dirigirse al castillo. ", "fase": "Conflicto"}, {"fase": "Conflicto", "descripcion": "Aparece el hada madrina y con magia le pone un vestido de gala y unos zapatos de cristal.", "id": "5"}, {"descripcion": "Cenicienta entra en el palacio y avanza hacia el gran salón, donde varias figuras anuncian la presencia de numerosos invitados.", "fase": "Desarrollo", "id": "6"}, {"descripcion": "El príncipe descubre a Cenicienta entre los asistentes; ambos destacan frente al resto de personajes reunidos en el salón.", "fase": "Desarrollo", "id": "7"}, {"fase": "Desarrollo", "id": "8", "descripcion": "Cenicienta y el príncipe bailan juntos en el centro de la celebración, mientras los demás invitados observan desde los márgenes."}, {"fase": "Desarrollo", "descripcion": "El reloj anuncia la medianoche; Cenicienta se separa precipitadamente del príncipe y comienza a huir del palacio.", "id": "9"}, {"descripcion": "Cenicienta desciende apresuradamente por las escaleras, dejando atrás uno de sus zapatos mientras las sombras vuelven a envolverla.", "id": "10", "fase": "Desarrollo"}, {"id": "11", "descripcion": "Cenicienta vuelve a casa sola y triste.", "fase": "Desarrollo"}, {"fase": "Desarrollo", "descripcion": "La madrastra les dice a sus hijas que finjan ser ellas las que han perdido ese zapato para quedarse con el príncipe.", "id": "12"}, {"fase": "Desarrollo", "id": "13", "descripcion": "El príncipe conserva el zapato perdido y envía emisarios por todo el reino para encontrar a la joven capaz de calzárselo."}, {"fase": "Desarrollo", "descripcion": "Una de las hermanas se prueba el zapato ante el príncipe, pero no logra encajarlo en su pie.", "id": "14"}, {"fase": "Desarrollo", "id": "15", "descripcion": "La otra hermana intenta ponerse el zapato ante el príncipe, pero tampoco logra encajarlo correctamente en su pie."}, {"descripcion": "Cenicienta tiene el otro zapato. Se prueba el zapato que trae el príncipe, que encaja perfectamente, mientras él la reconoce entre las demás jóvenes presentes.", "id": "16", "fase": "Resolución"}, {"descripcion": "Cenicienta se pone los dos zapatos y el príncipe reconoce que es a ella a quien estaba buscando.", "fase": "Resolución", "id": "17"}, {"id": "18", "fase": "Resolución", "descripcion": "Cenicienta y el príncipe se van a palacio. Dejando a la madrastra y hermanastra solas y enojadas."}, {"id": "19", "descripcion": "Cenicienta y el príncipe se enamoran y se casan. ", "fase": "Resolución"}, {"descripcion": "La Cenicienta y el príncipe celebran su boda con todo el pueblo y fueron muy felices y comieron perdices. ", "id": "20", "fase": "Situación final"}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
