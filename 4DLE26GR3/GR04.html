*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:var(--panel);box-shadow:0 2px 8px #0006}.bar{max-width:var(--max);margin:auto;padding:.65rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}.title{font-weight:650}.spacer{flex:1}.btn{border:1px solid #ffffff20;background:#ffffff0f;color:var(--text);padding:.45rem .7rem;border-radius:.6rem;cursor:pointer;text-decoration:none;font-size:.95rem}.btn:hover{background:#ffffff1f}.btn:disabled{opacity:.45;cursor:not-allowed}.stage{display:grid;place-items:center}.frame{width:100%;max-width:var(--max);padding:.6rem 1rem}figure{margin:0}.image-wrap{position:relative;background:#000;display:grid;place-items:center;border-radius:.8rem;overflow:hidden}#slide{display:block;width:100%;height:auto;max-height:calc(100vh - 220px);object-fit:contain}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.nav{pointer-events:auto;border:0;background:#0008;color:#fff;padding:.7rem .9rem;margin:.4rem;border-radius:.7rem;font-size:1.1rem;cursor:pointer}figcaption{margin:.8rem 0 0;line-height:1.5}.caption{font-size:var(--caption-size)}.meta{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap;color:var(--muted);margin-top:.25rem}.chip,.kbd{background:#ffffff14;border-radius:.4rem;padding:.15rem .4rem}.hi-contrast #slide{filter:contrast(1.1) saturate(1.05)}

<script>const DATA=[{"fase": "Situación inicial", "descripcion": "Cenicienta está sola en casa junto a la chimenea limpiando.", "id": "1"}, {"descripcion": "Cenicienta queda sometida a la madrastra y hermanastras.", "fase": "Situación inicial", "id": "3"}, {"id": "12", "descripcion": "La familia se prepara para el baile. ", "fase": "Situación inicial"}, {"descripcion": "Las hermanastras parten al baile.", "fase": "Situación inicial", "id": "2"}, {"id": "4", "descripcion": "Cenicienta queda atrás y observa como se van. ", "fase": "Conflicto"}, {"fase": "Conflicto", "id": "5", "descripcion": "Transformación del vestido de  Cenicienta. "}, {"descripcion": "Cenicienta se dirige al palacio", "fase": "Desarrollo", "id": "20"}, {"id": "6", "descripcion": "Cenicienta entra al palacio subiendo las escaleras.", "fase": "Desarrollo"}, {"fase": "Desarrollo", "id": "7", "descripcion": "Encuentro con el príncipe. "}, {"descripcion": "Baile con el príncipe. ", "id": "8", "fase": "Desarrollo"}, {"fase": "Desarrollo", "descripcion": "Permanecen juntos en el baile. ", "id": "9"}, {"descripcion": "Llega el momento de abandonar el baile. ", "id": "19", "fase": "Desarrollo"}, {"descripcion": "Cenicienta huye. ", "id": "18", "fase": "Desarrollo"}, {"fase": "Desarrollo", "descripcion": "Cenicienta se le cae el zapato bajando por las escaleras. ", "id": "10"}, {"id": "13", "descripcion": "El príncipe se queda con un zapato y empieza la búsqueda. ", "fase": "Desarrollo"}, {"descripcion": "Prueba la zapatilla a una hermanastra y no le cabe. ", "id": "15", "fase": "Resolución"}, {"descripcion": "Sucede lo mismo con la otra. ", "id": "14", "fase": "Resolución"}, {"descripcion": "Aparece Cenicienta con el otro zapato. ", "fase": "Resolución", "id": "11"}, {"id": "16", "fase": "Resolución", "descripcion": "El príncipe le pone el zapato a Cenicienta y le cabe. "}, {"id": "17", "fase": "Situación final", "descripcion": "Cenicienta se pone los dos zapatos y camina hacia el príncipe y vivieron felices. "}];const PREFIX="/lavater-app/images-secuencia/";let i=0,scale=1;const img=document.getElementById('slide'),caption=document.getElementById('caption');function show(n){if(n<0||n>=DATA.length)return;i=n;const x=DATA[i];img.src=PREFIX+encodeURIComponent(x.id+'.jpg');img.alt=`Secuencia ${i+1} de ${DATA.length}`;caption.textContent=x.descripcion||'';document.getElementById('phase').textContent=x.fase||'—';document.getElementById('original').textContent=x.id;document.getElementById('counter').textContent=`${i+1} / ${DATA.length}`;for(const id of ['prev','oprev'])document.getElementById(id).disabled=i===0;for(const id of ['next','onext'])document.getElementById(id).disabled=i===DATA.length-1}function next(){show(i+1)}function prev(){show(i-1)}for(const id of ['next','onext'])document.getElementById(id).onclick=next;for(const id of ['prev','oprev'])document.getElementById(id).onclick=prev;img.onclick=next;function fullscreen(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}document.getElementById('fs').onclick=fullscreen;function zoom(d){scale=Math.max(.6,Math.min(2.2,scale+d));caption.style.fontSize=`calc(var(--caption-size) * ${scale})`}document.getElementById('zin').onclick=()=>zoom(.1);document.getElementById('zout').onclick=()=>zoom(-.1);document.getElementById('contrast').onclick=()=>document.body.classList.toggle('hi-contrast');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='+')zoom(.1);if(e.key==='-')zoom(-.1)});show(0);</script></body></html>
